name: Deploy to EC2

on:
  push:
    branches:
      - master   # change to main if THIS repo uses main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            echo "🚀 Starting deployment..."

            # Fix git safe directories
            git config --global --add safe.directory /app/backend/api.seekvialove
            git config --global --add safe.directory /app/frontend/seekvialove/SVL

            # =========================
            # BACKEND (main branch)
            # =========================
            cd /app/backend/api.seekvialove
            git fetch --all --prune
            git reset --hard origin/main
            git clean -fd

            # =========================
            # FRONTEND (master branch)
            # =========================
            cd /app/frontend/seekvialove/SVL
            git fetch --all --prune
            git reset --hard origin/master
            git clean -fd

            # =========================
            # DEPLOY WITH DOCKER
            # =========================
            cd /app

            echo "🐳 Stopping containers..."
            docker-compose down

            echo "🔨 Building containers..."
            docker-compose -f docker-compose.yml up -d --build

            echo "🧹 Cleaning unused images..."
            docker image prune -f

            echo "✅ Deployment completed successfully"
