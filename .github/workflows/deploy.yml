name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.SEEKVIALOVE }}
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            cd /app/frontend/seekvialove/SVL

            git pull origin master

            cd /app

            docker compose down

            docker compose up -d --build

            docker image prune -f
