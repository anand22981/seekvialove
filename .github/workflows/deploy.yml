name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            echo "🚀 Starting deployment..."

            git config --global --add safe.directory /app/backend/api.seekvialove
            git config --global --add safe.directory /app/frontend/seekvialove/SVL

            # Pull backend
            cd /app/backend/api.seekvialove
            git pull origin master

            # Pull frontend
            cd /app/frontend/seekvialove/SVL
            git pull origin master

            # Go to compose directory
            cd /app

            echo "🐳 Stopping containers..."
            docker-compose down

            echo "🔨 Building & starting containers..."
            docker-compose -f docker-compose.yml up -d --build

            echo "🧹 Cleaning unused images..."
            docker image prune -f

            echo "✅ Deployment completed"
